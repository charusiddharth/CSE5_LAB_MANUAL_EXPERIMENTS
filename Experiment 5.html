<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Registration Form </title>
</head>
<body>
<h1 style="text-align: center;">STUDENT REGISTRATION FORM</h1>
<form action="#" method="post">
    
<P> Name: <input type="text" name="name" placeholder="ENTER YOUR FULL NAME "required></P>
<p> Email: <input type="email" name="email" placeholder="ENTER YOUR VALID EMAIL " required></p>
<P> Password: <input type="password" name="password" placeholder="ENTER PASSWORD" required></P>
<p>Gender: <input type="radio" name="gender" value="male" required> Male
<input type="radio" name="gender" value="female" required> Female
<input type="radio" name="gender" value="other" required> Other</p>
</p>
<P> Course: <select name="course" required>
    <option value="">--Select course--</option>
    <option value="B.Tech">B.Tech</option>
    <option value="BCA">BCA</option>
    <option value="MCA">MCA</option>
    </select>
</P>  
<p>Contact No: <input type="tel" name="contact" placeholder="ENTER PHONE NUMBER " required></p>
<p>
     Address:
     <br><textarea name="address" rows="4" cols="50" placeholder="ENTER YOUR ADDRESS " required></textarea></p>
<p> <input type="submit" value="Register"> 
    <input type="reset" value="clear"></p>
</P>
</form>
