<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOTEL ROOM BOOKING FORM  </title>
</head>
<body>
    <H1 style="text-align: center;">HOTEL ROOM BOOKING FORM</H1>
  <form  action="#" method="post">
    <p> Full Name: <input type="text" name="name" placeholder="Enter your full name" required></p>
    <p> Email : <input type="email" placeholder="Enter your email"required></p>
    <p> Phone: <input type="tel" name="phone" placeholder="Enter your phone number" required></p>
    <p> Check-in Date : <input type="date" name="checkin" required></p>
    <p>Check-out Date : <input type="date" name="checkout" required></p>
    <p> Room type: <select name="Room-type" requied>
        <option value="">--Select Room Type--</option>
        <option value="Single">Single</option>
        <option value="Double">Double</option>
        <option value="Suite">Suite</option> 
        </select></p>
        <p>Special Requests: 
        <br>
        <textarea name="Requests" rows="10" cols="50" placeholder="Enter Special Requests"></textarea></p>
        <p> 
            <input type="SUBMIT" Value="Book Now">
            <input type="RESET" value="Reset Form"> 
        </p>
        </form>
</body>
</html>
